name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site files
        run: |
          mkdir dist
          rsync -a --exclude='.git' --exclude='.github' --exclude='scripts' --exclude='deployment' --exclude='dist' ./ dist/

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy
        run: npx --yes wrangler@3 pages deploy dist --project-name=findorah-0h6 --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
